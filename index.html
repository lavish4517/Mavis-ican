<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mavis-ican Web3 Registry</title>
    <script src="https://cloudflare.com"></script>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; text-align: center; background: #0a0a0f; color: #e2e8f0; padding: 40px 20px; margin: 0; }
        .card { border: 1px solid #1f2937; padding: 30px 20px; display: inline-block; border-radius: 16px; background: #11111b; max-width: 500px; width: 100%; box-shadow: 0 4px 30px rgba(0,0,0,0.7); margin-bottom: 25px; box-sizing: border-box; }
        h1 { color: #22c55e; margin: 0 0 5px 0; font-size: 24px; text-transform: uppercase; letter-spacing: 1px; }
        p { color: #94a3b8; margin: 0 0 25px 0; font-size: 14px; }
        .form-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 6px; color: #94a3b8; font-size: 13px; }
        .input-row { display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px; outline: none; width: 100%; box-sizing: border-box; }
        input:focus { border-color: #22c55e; }
        button { padding: 12px 24px; border-radius: 8px; border: none; background: #22c55e; color: #0f172a; font-weight: bold; font-size: 15px; cursor: pointer; transition: all 0.2s; }
        button:hover { background: #4ade80; box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
        button.wallet-btn { background: #dfa823; color: #000; width: 100%; margin-bottom: 20px; }
        button.wallet-btn:hover { background: #f0bd46; box-shadow: 0 0 15px rgba(223, 168, 35, 0.4); }
        button.blue-btn { background: #3b82f6; color: #fff; width: 100%; }
        button.blue-btn:hover { background: #60a5fa; box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        .result-box { padding: 15px; border-radius: 8px; font-weight: bold; margin-top: 15px; display: none; text-align: left; font-size: 14px; word-break: break-all; }
        .status-ready { background: rgba(34, 197, 94, 0.05); border: 1px solid #22c55e; color: #4ade80; }
        .status-error { background: rgba(239, 68, 68, 0.05); border: 1px solid #ef4444; color: #f87171; }
    </style>
</head>
<body>

    <div class="card">
        <h1>🔑 Web3 Authentication</h1>
        <p>Link Your Cryptographic Identity Engine</p>
        <button class="wallet-btn" id="connectButton" onclick="connectWallet()">Connect Crypto Wallet</button>
        <div id="walletStatus" style="font-size:12px; color:#94a3b8;">Status: Disconnected</div>
    </div>

    <div class="card">
        <h1>🌐 Blockchain Registry Search</h1>
        <p>Query On-Chain Root Architecture Mappings</p>
        <div class="input-row">
            <input type="text" id="domainInput" placeholder="Enter domain (e.g., test.star)...">
            <button onclick="searchBlockchainDomain()">Search</button>
        </div>
        <div id="searchResult" class="result-box"></div>
    </div>

    <div class="card">
        <h1>✍️ Mint New Web3 String</h1>
        <p>Execute Blockchain Transaction to Claim Domain</p>
        <div class="form-group">
            <label>Domain String Name</label>
            <input type="text" id="regDomain" placeholder="e.g., company.star">
        </div>
        <div class="form-group">
            <label>Target IP Route Address</label>
            <input type="text" id="regIp" placeholder="e.g., 8.8.8.8">
        </div>
        <button class="blue-btn" onclick="mintOnChainDomain()">Mint Domain via Wallet</button>
        <div id="mintResult" class="result-box"></div>
    </div>

    <script>
        let userWalletAddress = null;
        let provider = null;
        let signer = null;

        // Mock Deployment Contract Configurations for testing purposes
        const CONTRACT_ADDRESS = "0x0000000000000000000000000000000000000000";
        const CONTRACT_ABI = [];

        async function connectWallet() {
            if (typeof window.ethereum !== 'undefined') {
                try {
                    provider = new ethers.BrowserProvider(window.ethereum);
                    const accounts = await provider.send("eth_requestAccounts", []);
                    signer = await provider.getSigner();
                    userWalletAddress = accounts[0];

                    document.getElementById('connectButton').innerText = "Wallet Linked!";
                    document.getElementById('walletStatus').innerHTML = `Connected Securely: <code>${userWalletAddress.substring(0,6)}...${userWalletAddress.substring(38)}</code>`;
                } catch (err) {
                    alert("User rejected cryptographic connection request.");
                }
            } else {
                alert("Crypto wallet engine not detected. Please use a Web3 browser layout like MetaMask, Trust Wallet, or Brave.");
            }
        }

        function searchBlockchainDomain() {
            const domain = document.getElementById('domainInput').value.trim().toLowerCase();
            const resultBox = document.getElementById('searchResult');
            if(!domain) return alert('Please input a string.');

            resultBox.style.display = "block";
            resultBox.className = "result-box status-ready";
            resultBox.innerHTML = `🔍 Simulating smart contract call for [${domain}]...<br><span style='color:#94a3b8; font-size:12px;'>When deployed, this initiates a gasless read call directly to the chain ledger node.</span>`;
        }

        function mintOnChainDomain() {
            const domain = document.getElementById('regDomain').value.trim().toLowerCase();
            const ip = document.getElementById('regIp').value.trim();
            const resultBox = document.getElementById('mintResult');

            if (!userWalletAddress) return alert('Please link your cryptographic authentication wallet first.');
            if (!domain || !ip) return alert('Please clear all processing inputs.');

            resultBox.style.display = "block";
            resultBox.className = "result-box status-ready";
            resultBox.innerHTML = `📡 Staging transaction package...<br>Awaiting user signature in MetaMask to burn gas and write <strong>${domain}</strong> to the block ledger.`;
        }
    </script>
    <script>
// Available wallet options for the pop-up menu
const AVAILABLE_WALLETS = [
    { id: 'metamask', name: 'MetaMask', icon: '🦊' },
    { id: 'walletconnect', name: 'WalletConnect', icon: '🌐' },
    { id: 'trustwallet', name: 'Trust Wallet', icon: '🛡️' },
    { id: 'coinbase', name: 'Coinbase', icon: '🔵' }
];

let connectedAccount = null;

// Initialize the click handler when the DOM loads
document.addEventListener('DOMContentLoaded', () => {
    const connectBtn = document.getElementById('connectButton');
    if (connectBtn) {
        connectBtn.addEventListener('click', showWalletModal);
    }
    injectModalCSS();
});

function showWalletModal() {
    if (document.getElementById('wallet-selection-modal')) return;

    const modal = document.createElement('div');
    modal.id = 'wallet-selection-modal';
    modal.className = 'wallet-modal-overlay';

    let walletListHTML = AVAILABLE_WALLETS.map(wallet => `
        <button class="wallet-option-btn" onclick="selectWalletProvider('${wallet.id}', '${wallet.name}')" style="display: flex; align-items: center; gap: 15px; width: 100%; padding: 12px 16px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #f8fafc; cursor: pointer; text-align: left; font-size: 1rem; margin-bottom: 8px;">
            <span style="font-size: 1.5rem;">${wallet.icon}</span>
            <span style="font-weight: 500;">${wallet.name}</span>
        </button>
    `).join('');

    modal.innerHTML = `
        <div class="wallet-modal-card" style="background: #1e293b; border: 1px solid #334155; border-radius: 12px; width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);">
            <div style="display: flex; justify-content: space-between; align-items: center; color: #f8fafc; margin-bottom: 8px;">
                <h3 style="margin: 0; font-size: 1.25rem;">Select a Web3 Wallet</h3>
                <button onclick="closeWalletModal()" style="background: transparent; border: none; color: #94a3b8; font-size: 1.75rem; cursor: pointer; line-height: 1;">&times;</button>
            </div>
            <p style="color: #94a3b8; font-size: 0.9rem; margin: 0 0 20px 0;">Choose a wallet provider to connect:</p>
            <div class="wallet-options-list">${walletListHTML}</div>
        </div>
    `;

    document.body.appendChild(modal);
}

window.closeWalletModal = function() {
    const modal = document.getElementById('wallet-selection-modal');
    if (modal) modal.remove();
};

window.selectWalletProvider = async function(walletId, walletName) {
    closeWalletModal();
    const statusLabel = document.getElementById('walletStatus');
    if (statusLabel) statusLabel.innerText = `Connecting to ${walletName}...`;

    try {
        if (walletId === 'metamask' && window.ethereum) {
            const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
            connectedAccount = accounts[0];
        } else {
            // Simulated connection for testing environment
            connectedAccount = "0x" + Array.from({length: 40}, () => Math.floor(Math.random()*16).toString(16)).join('');
        }

        if (statusLabel) {
            const displayAddr = `${connectedAccount.substring(0, 6)}...${connectedAccount.substring(38)}`;
            statusLabel.innerText = `Status: Connected (${displayAddr})`;
            statusLabel.style.color = "#4ade80";
        }

        // Enable all disabled inputs and buttons on the page
        document.querySelectorAll('input, button').forEach(el => {
            el.removeAttribute('disabled');
            el.disabled = false;
        });

    } catch (error) {
        console.error(error);
        if (statusLabel) {
            statusLabel.innerText = "Status: Connection Failed";
            statusLabel.style.color = "#f87171";
        }
    }
};

function injectModalCSS() {
    const style = document.createElement('style');
    style.innerHTML = `
        .wallet-modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); display: flex;
            align-items: center; justify-content: center; z-index: 9999;
            font-family: sans-serif; padding: 20px; box-sizing: border-box;
        }
    `;
    document.head.appendChild(style);
}
</script>
<!-- Include official Ethers.js and WalletConnect Web3Modal libraries -->
<script src="https://cloudflare.com"></script>
<script src="https://unpkg.com"></script>
<script src="https://unpkg.com"></script>

<script>
let provider;
let signer;
let userAddress;

// Configure the connection utility settings
const Web3Modal = window.Web3Modal.default;
const WalletConnectProvider = window.WalletConnectProvider.default;

const providerOptions = {
  walletconnect: {
    package: WalletConnectProvider,
    options: {
      // Replace with a valid Project ID from ://walletconnect.com
      rpc: {
        1: "https://cloudflare-eth.com", // Mainnet
        137: "https://polygon-rpc.com"   // Polygon Network
      }
    }
  }
};

const web3Modal = new Web3Modal({
  cacheProvider: false, 
  providerOptions,
  theme: "dark"
});

async function initiateRealConnection() {
  try {
    // This triggers the official modal displaying MetaMask, Trust, WalletConnect, etc.
    const instance = await web3Modal.connect();
    provider = new ethers.BrowserProvider(instance);
    signer = await provider.getSigner();
    userAddress = await signer.getAddress();

    // Update the UI state upon successful authentication
    const statusLabel = document.getElementById('walletStatus');
    if (statusLabel) {
      statusLabel.innerText = `Status: Connected (${userAddress.substring(0,6)}...)`;
      statusLabel.style.color = "#4ade80";
    }

    // Enable application inputs
    document.querySelectorAll('input, button').forEach(el => el.disabled = false);

  } catch (error) {
    console.error("Wallet connection closed or rejected:", error);
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const connectBtn = document.getElementById('connectButton');
  if (connectBtn) connectBtn.addEventListener('click', initiateRealConnection);
});
</script>

</body>
</html>
